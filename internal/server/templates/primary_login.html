<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Вход</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         margin: 0; min-height: 100vh; display: flex; align-items: center;
         justify-content: center; background: #f5f6f8; color: #1a1a1a; }
  .card { width: 100%; max-width: 360px; background: #fff; border-radius: 12px;
          box-shadow: 0 6px 24px rgba(0,0,0,.08); padding: 28px; box-sizing: border-box; }
  h1 { font-size: 18px; margin: 0 0 20px; font-weight: 600; }
  label { display: block; font-size: 13px; margin: 12px 0 4px; color: #555; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 15px;
          border: 1px solid #cfd4da; border-radius: 8px; background: #fff; color: #1a1a1a; }
  button { width: 100%; margin-top: 20px; padding: 11px; font-size: 15px; border: 0;
           border-radius: 8px; background: #2d6cdf; color: #fff; cursor: pointer; }
  button:hover { background: #245bc0; }
  .err { margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: 14px;
         background: #fdecec; color: #b42318; }
</style>
</head>
<body>
  <main class="card">
    <h1>Вход в систему</h1>
    <form method="post" action="" autocomplete="off">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <label for="username">Логин</label>
      <input id="username" name="username" type="text" required autocapitalize="off" autocomplete="off">
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" required autocomplete="off">
      <button type="submit">Войти</button>
    </form>
    {{if .Error}}<div class="err">{{.Error}}</div>{{end}}
  </main>
</body>
</html>
