services:
  app:
    image: login-to-read-normal-app:1.0.1
    #build:
    #  context: .
    #  dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Override so the container always uses the mounted volume path.
      DB_PATH: /data/app.db
      LISTEN_ADDR: ":8080"
    volumes:
      - ./data:/data:rw
    # раскомментировать если не работает
    #expose:
    #  - "8080"          # internal only; never published to the host
    ports:
      - "127.0.0.1:8084:8080"
    restart: unless-stopped
    networks:
      - web

networks:
  web:
    driver: bridge