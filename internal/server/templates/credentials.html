<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Доступ выдан</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         margin: 0; min-height: 100vh; display: flex; align-items: center;
         justify-content: center; background: #f5f6f8; color: #1a1a1a; padding: 20px; }
  .card { width: 100%; max-width: 560px; background: #fff; border-radius: 12px;
          box-shadow: 0 6px 24px rgba(0,0,0,.08); padding: 28px; box-sizing: border-box; }
  h1 { font-size: 18px; margin: 0 0 8px; font-weight: 600; }
  p.hint { margin: 0 0 20px; font-size: 14px; color: #b42318; }
  label { display: block; font-size: 13px; margin: 16px 0 4px; color: #555; }
  .row { display: flex; gap: 8px; }
  code, input { flex: 1; width: 100%; box-sizing: border-box; padding: 10px 12px;
                font-size: 14px; border: 1px solid #cfd4da; border-radius: 8px;
                background: #f8f9fb; color: #1a1a1a; font-family: ui-monospace, Menlo, monospace; }
  button { padding: 10px 14px; font-size: 14px; border: 0; border-radius: 8px;
           background: #2d6cdf; color: #fff; cursor: pointer; white-space: nowrap; }
  button:hover { background: #245bc0; }
  .ok { margin-top: 18px; padding: 10px 12px; border-radius: 8px; font-size: 14px;
        background: #ecfdf3; color: #067647; display: none; }
</style>
</head>
<body>
  <main class="card">
    <h1>Доступ выдан</h1>
    <p class="hint">Сохраните эти данные. Пароль и ссылка показываются только один раз.</p>

    <label>Постоянная ссылка (адрес интерфейса)</label>
    <div class="row">
      <input id="link" type="text" readonly value="{{.LinkURL}}">
      <button type="button" onclick="copyVal('link')">Копировать</button>
    </div>

    <label>Постоянный пароль</label>
    <div class="row">
      <input id="pw" type="text" readonly value="{{.Password}}">
      <button type="button" onclick="copyVal('pw')">Копировать</button>
    </div>

    <div class="ok" id="ok">Скопировано</div>
  </main>
<script>
function copyVal(id) {
  var el = document.getElementById(id);
  el.select();
  el.setSelectionRange(0, 99999);
  var done = function () {
    var ok = document.getElementById('ok');
    ok.style.display = 'block';
    setTimeout(function () { ok.style.display = 'none'; }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(el.value).then(done, function () { document.execCommand('copy'); done(); });
  } else {
    document.execCommand('copy');
    done();
  }
}
</script>
</body>
</html>
