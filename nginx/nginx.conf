user  nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    # [ОБЯЗАТЕЛЬНО] Таблицы MIME: без них все ответы уходят как
    #                application/octet-stream (браузер скачивает HTML вместо показа).
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    # [ВАЖНО] Лог доступа: единственный способ увидеть, что реально пришло на nginx.
    access_log /var/log/nginx/access.log main;

    # [ОПЦИОНАЛЬНО] Формат для диагностики 404: показывает апстрим и его ответ.
    #   "-" в upstream_addr = запрос не дошёл до приложения (nginx 404, не app 404).
    #   Включается директивой  access_log ... upstream;  в conf.d/default.conf.
    # log_format upstream '$remote_addr "$request" $status '
    #                     '-> $upstream_addr $upstream_status ${upstream_response_time}s';

    sendfile        on;
    keepalive_timeout 65;

    # [ВАЖНО] Не светим версию nginx и не листим каталоги.
    server_tokens off;
    autoindex off;

    # [ОПЦИОНАЛЬНО] Сжатие. text/html сжимается всегда и в списке не нужен.
    gzip on;
    gzip_types text/css application/javascript text/plain;

    # [ОБЯЗАТЕЛЬНО] Подключение виртуальных хостов (весь наш проксирующий конфиг
    #               лежит в conf.d/default.conf). Если эту строку убрать или
    #               указать неверный путь — nginx поднимется, но НИ ОДИН server{}
    #               не будет загружен, и на все запросы пойдёт дефолтная
    #               страница/404 самого nginx.
    #               Строка должна идти ПОСЛЕ mime.types и любых log_format.
    include /etc/nginx/conf.d/*.conf;
}
