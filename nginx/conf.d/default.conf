# =============================================================================
#  default.conf — единственное место, где описан весь публичный HTTP-трафик.
#  Всё остальное решает приложение: nginx НЕ добавляет своих маршрутов,
#  не отдаёт файлы с диска и не генерирует своих страниц ошибок.
#
#  Легенда пометок:
#    [ОБЯЗАТЕЛЬНО] — без этого не работает (или ломается роутинг/безопасность)
#    [ВАЖНО]       — не влияет на 404, но нужно для корректной работы
#    [ОПЦИОНАЛЬНО] — тюнинг/косметика, можно менять и убирать
#
# -----------------------------------------------------------------------------
#  ЕСЛИ ВЫ ПОЛУЧАЕТЕ 404 — сначала посмотрите ТЕЛО ответа (curl -i):
#
#   * тело вида  <!doctype html>...<h1>404</h1><p>Not found.</p>
#     => запрос ДОШЁЛ до приложения, но путь ему неизвестен.
#        Причина: nginx переписал путь (пункт A ниже) ИЛИ вы открыли не тот
#        URL (приложение намеренно отдаёт одинаковый 404 на всё неизвестное —
#        так задумано для «стерильной» первичной страницы).
#
#   * тело вида  <html>...404 Not Found...nginx...  (или просто пусто)
#     => запрос НЕ дошёл до приложения, 404 сгенерировал сам nginx.
#        Причина: в location есть root/try_files/index/alias (пункт B),
#        либо proxy_pass смотрит не туда, либо не совпал server_name.
#
#   Диагностика: логирование апстрима — см. [ОПЦИОНАЛЬНО] в конце файла.
# -----------------------------------------------------------------------------
#  ТОП-причины 404 при «почти таком же» конфиге:
#
#   A) У proxy_pass есть URI — то есть что-то после порта: слэш или путь.
#        proxy_pass http://app:8080;    <-- ПРАВИЛЬНО (URI отсутствует)
#        proxy_pass http://app:8080/;   <-- ломает пути для префиксных location
#        proxy_pass http://app:8080/x;  <-- гарантированный 404
#      Nginx при наличии URI заменяет совпавшую с location часть пути на этот
#      URI. Для location / это случайно безвредно, а для location /l/ путь
#      "/l/<token>" превратится в "/<token>" -> 404.
#      Любые rewrite/alias/return в location — то же самое.
#
#   B) В location есть попытка отдать файл с диска:
#        try_files $uri $uri/ =404;  root ...;  index ...;  autoindex on;
#      Тогда nginx отвечает сам и до приложения не доходит.
#      В этом конфиге НЕТ ни root, ни try_files — так и должно быть.
#
#   C) proxy_pass смотрит не на контейнер приложения.
#      Внутри docker-сети адрес — имя сервиса: http://app:8080
#      (см. docker-compose.yml: сервис app, expose 8080).
#      "localhost:8080" из контейнера nginx — это сам nginx, а не приложение.
#      Неверный хост вообще обычно даёт 502, а не 404.
#
#   D) Не совпал server_name / нет default_server, когда server-блоков
#      несколько: запрос обработает другой (чужой) блок.
#
#   E) Приложение поднято с другим PRIMARY_URL_PATH (.env), а вы открываете
#      старый путь: приложение отдаст свой одинаковый 404 (это не баг).
# =============================================================================

# ---------------------------------------------------------------------------
#  HTTP (порт 80): только редирект на HTTPS.
#  [ОПЦИОНАЛЬНО] Сам по себе блок не обязателен; нужен, чтобы http не висел
#                и чтобы cookie с флагом Secure не терялись.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
#  HTTPS (порт 443): терминируем TLS и проксируем ВСЁ в приложение.
# ---------------------------------------------------------------------------
server {
    # [ОБЯЗАТЕЛЬНО] Прослушивание 443 + ssl. Без "ssl" TLS не включится.
    # [ВАЖНО]       default_server — этот блок становится обработчиком по
    #               умолчанию (для любого Host).
    listen 443 ssl default_server;

    # [ОПЦИОНАЛЬНО] HTTP/2 (в nginx >= 1.25.1 синтаксис "http2 on;").
    http2 on;

    # [ВАЖНО] "_" = любой Host. Если поставить конкретное имя, а запрос придёт
    #         с другим Host (или по IP), блок не совпадёт -> возможен 404.
    server_name _;

    # [ОБЯЗАТЕЛЬНО] Сертификат и ключ. Без них nginx не стартует.
    #               Файлы готовит nginx/entrypoint.sh (self-signed) либо вы
    #               кладёте свои в ./nginx/certs (смонтированы в compose).
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # [ОПЦИОНАЛЬНО] Ограничение версий/шифров и кэш TLS-сессий.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # [ВАЖНО] Лимит размера тела запроса: пасты отправляются POST-ом.
    #         По умолчанию 1m -> при большой пасте будет 413 (не 404).
    client_max_body_size 8m;

    # [ОБЯЗАТЕЛЬНО] Единственный location — префикс "/" покрывает ВСЁ:
    #               и первичный вход (/login), и постоянные ссылки (/l/<token>/...).
    #               Именно поэтому ничего переписывать не нужно и 404 не появляется.
    #               НЕ добавляйте сюда root/try_files/index/alias и НЕ заводите
    #               других location-блоков: любой из них уводит запрос от приложения.
    location / {
        # [ОБЯЗАТЕЛЬНО] Проксирование в контейнер приложения.
        #   * имя "app" — это имя сервиса из docker-compose.yml (внутренняя сеть);
        #   * порт 8080 — LISTEN_ADDR приложения;
        #   * ПОСЛЕ порта НЕ ДОЛЖНО быть слэша или пути (см. пункт A в шапке).
        proxy_pass http://app:8080;

        # [ВАЖНО] HTTP/1.1 — нужен для keep-alive до апстрима и корректной
        #         работы без Connection: close.
        proxy_http_version 1.1;

        # [ВАЖНО] Host передаём как есть. Приложение его сейчас не использует
        #         для маршрутизации (поэтому его отсутствие НЕ даёт 404),
        #         но это правильный дефолт для прокси.
        proxy_set_header Host              $host;

        # [ВАЖНО] Реальный IP клиента: приложение берёт его из X-Real-IP
        #         (затем X-Forwarded-For) для rate-limit попыток входа.
        #         Без этого лимит считается по IP docker-шлюза.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # [ВАЖНО] Схема исходного запроса (https) — на случай, если приложение
        #         начнёт использовать её для редиректов.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # [ОПЦИОНАЛЬНО] Таймаут ожидания ответа апстрима.
        proxy_read_timeout 60s;
    }

    # [ОПЦИОНАЛЬНО] Логирование апстрима — самое полезное при разборе 404:
    #               видно, дошёл ли запрос до приложения и что оно ответило.
    #               Раскомментируйте вместе с log_format ниже в http{}.
    # access_log /var/log/nginx/access.log upstream;

}

# ---------------------------------------------------------------------------
# [ОПЦИОНАЛЬНО] Формат лога для диагностики 404.
#   Директива log_format допустима только на уровне http{} — поэтому её нельзя
#   объявить здесь, в файле из conf.d/*.conf. Скопируйте строку ниже в
#   nginx/nginx.conf внутрь блока http{} и включите access_log выше.
#
#   upstream_addr          — куда ушёл запрос; "-" означает, что запрос вообще
#                            не дошёл до приложения (nginx ответил сам) -> это
#                            "nginx 404", а не "app 404".
#   upstream_status        — код, который вернуло приложение.
#   upstream_response_time — сколько nginx ждал ответ.
#
#   Пример строки в http{}:
#     log_format upstream '$remote_addr "$request" $status '
#                         '-> $upstream_addr $upstream_status ${upstream_response_time}s';
# ---------------------------------------------------------------------------

